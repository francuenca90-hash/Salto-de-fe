# Compila el juego y genera el APK en los servidores de GitHub (no necesitas instalar nada en tu ordenador).
# Se ejecuta al subir cambios a la rama principal o manualmente desde la pestaña "Actions".
name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias (npm, Fable y NuGet)
        run: |
          npm install
          npm run restore

      - name: Compilar el juego (F# → JS → dist/)
        run: npm run build

      - name: Crear el proyecto Android si no existe
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Compilar el APK de depuración
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar el APK como descarga
        uses: actions/upload-artifact@v4
        with:
          name: salto-de-fe-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
